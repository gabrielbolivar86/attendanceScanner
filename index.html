<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; }
    video { width: 100%; max-width: 400px; }
    #resultado { font-size: 1.3em; margin-top: 10px; }
  </style>
</head>
<body>
  <h3>Lector de asistencia</h3>
  <video id="video"></video>
  <canvas id="canvas" hidden></canvas>
  <div id="resultado">Apunta al QR del alumno...</div>

  <script>
    // ⚠️ Debe ser IDÉNTICO al AUTH_TOKEN en Code.gs
    const AUTH_TOKEN = "un-secreto-largo-y-dificil-2026";

    // URL de la nueva implementación
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygA2nrvO6M0ZN_G4Aa2_IhpjGi5ti8IYkNaV2CS7wvlXGCqKDCcPp4oIxGsw3JrSIH4A/exec";

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const resultadoDiv = document.getElementById('resultado');
    let escaneando = true;

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(stream => { video.srcObject = stream; video.play(); requestAnimationFrame(tick); })
      .catch(err => { resultadoDiv.textContent = "❌ Error de cámara: " + err.message; });

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA && escaneando) {
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        if (code) registrar(code.data);
      }
      requestAnimationFrame(tick);
    }

    function registrar(contenidoQR) {
      escaneando = false;
      resultadoDiv.textContent = "Enviando...";

      const partes = contenidoQR.split(";");
      if (partes.length !== 3) {
        resultadoDiv.textContent = "❌ QR con formato inválido";
        setTimeout(() => { escaneando = true; resultadoDiv.textContent = "Apunta al QR del alumno..."; }, 2000);
        return;
      }
      const [nombre, apellido, curso] = partes;

      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ nombre, apellido, curso, token: AUTH_TOKEN })
      })
        .then(r => r.text())
        .then(txt => {
          const data = JSON.parse(txt);
          resultadoDiv.textContent = data.mensaje;
          setTimeout(() => { escaneando = true; resultadoDiv.textContent = "Apunta al QR del alumno..."; }, 2000);
        })
        .catch(() => {
          resultadoDiv.textContent = "❌ Error de conexión";
          setTimeout(() => { escaneando = true; }, 2000);
        });
    }
  </script>
</body>
</html>
