<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; }
    video { width: 100%; max-width: 400px; }
    #resultado { font-size: 1.3em; margin-top: 10px; }
  </style>
</head>
<body>
  <h3>Lector de asistencia</h3>
  <video id="video"></video>
  <canvas id="canvas" hidden></canvas>
  <div id="resultado">Apunta al QR del alumno...</div>

  <script>
    const AUTH_TOKEN = "un-secreto-largo-y-dificil-2026";
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const resultadoDiv = document.getElementById('resultado');
    let escaneando = true;

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(stream => { video.srcObject = stream; video.play(); requestAnimationFrame(tick); });

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA && escaneando) {
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        if (code) registrar(code.data);
      }
      requestAnimationFrame(tick);
    }

    function registrar(id) {
      escaneando = false;
      resultadoDiv.textContent = "Enviando...";
      fetch(window.location.href, { method: "POST", body: JSON.stringify({ id: id, token: AUTH_TOKEN }) })
        .then(r => r.text())
        .then(txt => {
          resultadoDiv.textContent = JSON.parse(txt).mensaje;
          setTimeout(() => { escaneando = true; resultadoDiv.textContent = "Apunta al QR del alumno..."; }, 2000);
        });
    }
  </script>
</body>
</html>
